name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not belong here. Use
        [private reporting](https://github.com/clezappdev-alt/gradual-knowledge-discovery/security/advisories/new).
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: The observed behavior, with the exact command and output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Quote the documentation or requirement that led you to expect it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or commit sha.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, and anything else that could matter.
    validations:
      required: false
