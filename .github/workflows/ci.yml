name: ci

# A fork runs this with a read-only token and no secrets, which is why the
# workflow needs neither. It runs the command CONTRIBUTING.md documents,
# verbatim: if it is green locally it is green here.
#
# Actions are pinned to full commit SHAs (the version is in the comment):
# a tag like @v5 is a mutable ref, and whoever can move it runs code here.
# The matrix is the security baseline, not a wish: the declared floor, Active
# LTS and Current. Node 20 is absent on purpose - it reached end of life on
# 2026-04-30 and no longer receives security patches.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.4", "24", "26"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: node --version
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
